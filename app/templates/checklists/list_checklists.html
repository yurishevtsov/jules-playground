{% extends "base.html" %}

{% block title %}My Checklists{% endblock %}

{% block content %}
    <h2>My Checklists <a href="{{ url_for('new_checklist') }}" style="font-size: 0.7em; font-weight:normal;">(Create New)</a></h2>
    <ul>
        {% for checklist in checklists %}
        <li>
            <a href="{{ url_for('view_checklist', checklist_id=checklist.id) }}">{{ checklist.title }}</a>
            <a href="{{ url_for('edit_checklist', checklist_id=checklist.id) }}">(Edit Title)</a>
            <form action="{{ url_for('delete_checklist', checklist_id=checklist.id) }}" method="POST" style="display:inline;">
                <input type="submit" value="Delete Checklist" onclick="return confirm('Are you sure? This will delete the checklist and all its items.');">
            </form>
        </li>
        {% else %}
        <li>No checklists yet. <a href="{{ url_for('new_checklist') }}">Create one?</a></li>
        {% endfor %}
    </ul>
{% endblock %}
